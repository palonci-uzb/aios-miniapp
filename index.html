<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIOS IELTS Practice</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Bosh menyu / Dashboard -->
        <div id="main-dashboard" class="container">
            <header class="header">
                <h2>?? AIOS IELTS Learning OS</h2>
                <p>Amaliyot bo'limini tanlang:</p>
            </header>

            <div class="card-grid">
                <div class="card" onclick="showReadingList()">
                    <h3>?? Reading Practice</h3>
                    <p>3 ta tayyor passage mavjud</p>
                </div>
                <div class="card disabled">
                    <h3>?? Listening Practice</h3>
                    <p>Tez kunda...</p>
                </div>
            </div>
        </div>

        <!-- Reading Testlar Ro'yxati -->
        <div id="reading-list" class="container hidden">
            <button class="back-btn" onclick="showDashboard()">?? Orqaga</button>
            <h2>?? IELTS Reading Passages</h2>
            <div class="test-list">
                <button class="test-btn" onclick="openTest('practise reading/Passage 1-A Brief History of Humans and Food.html')">
                    <strong>Passage 1:</strong> A Brief History of Humans and Food
                </button>
                <button class="test-btn" onclick="openTest('practise reading/Passage 3-A new stage in the study and teaching of history.html')">
                    <strong>Passage 3:</strong> A new stage in the study and teaching of history
                </button>
                <button class="test-btn" onclick="openTest('practise reading/Passage 3-Crossing the Threshold.html')">
                    <strong>Passage 3:</strong> Crossing the Threshold
                </button>
            </div>
        </div>

        <!-- Test ko'rish oynasi (iframe) -->
        <div id="test-view" class="container hidden">
            <div class="top-bar">
                <button class="back-btn" onclick="showReadingList()">?? Testlar ro'yxatiga qaytish</button>
            </div>
            <iframe id="test-frame" src="" frameborder="0"></iframe>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
