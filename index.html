<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AIOS Practice Engine</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <!-- Main Dashboard -->
    <div id="main-dashboard" class="container">
        <div class="app-header">
            <h1>?? AIOS Practice</h1>
            <span id="passage-count" style="font-size: 12px; color: #888;">0 Passages</span>
        </div>

        <div style="margin-top: 16px;">
            <h3>?? Reading Passages</h3>
            <p style="font-size: 13px; color: #aaa; margin-bottom: 12px;">Testni tanlang va to'liq ekranda ishlang:</p>
            <div id="full-practice-list">
                <!-- Testlar ro'yxati chiqadi -->
            </div>
        </div>
    </div>

    <!-- FULL SCREEN TEST VIEW (Focused) -->
    <div id="test-view" class="hidden">
        <div class="test-header-bar">
            <button class="back-btn">?? Orqaga</button>
            <span id="active-test-title" class="test-title-text">Reading Test</span>
        </div>
        <div class="test-frame-container">
            <iframe id="test-frame" src="about:blank"></iframe>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
