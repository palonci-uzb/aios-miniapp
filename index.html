<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AIOS Learning OS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="banner" class="banner hidden"></div>

    <!-- Asosiy ilova: ekranlar app.js tomonidan #screen ichiga chiziladi -->
    <div id="app" class="app-shell">
        <main id="screen" class="container"></main>
        <nav id="nav" class="bottom-nav">
            <button data-nav="home"><span>🏠</span>Home</button>
            <button data-nav="reading"><span>📖</span>Reading</button>
            <button data-nav="types"><span>🎯</span>Types</button>
            <button data-nav="retry"><span>🔁</span>Retry</button>
            <button data-nav="progress"><span>📈</span>Progress</button>
        </nav>
    </div>

    <!-- FULLSCREEN TEST (mavjud Reading HTML testlari, o'zgartirilmagan) -->
    <div id="test-view" class="hidden">
        <div class="test-header-bar">
            <button class="back-btn" id="test-back">&larr; Orqaga</button>
            <span id="active-test-title" class="test-title-text">Reading Test</span>
        </div>
        <div class="test-frame-container">
            <iframe id="test-frame" src="about:blank"></iframe>
        </div>
        <div id="test-overlay" class="test-overlay hidden"></div>
    </div>

    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
